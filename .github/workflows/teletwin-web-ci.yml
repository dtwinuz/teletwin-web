# TeleTwin web checks for pull requests into `teletwin`: tsc, eslint, vitest.
# Upstream Web A code is not lint-clean under the current toolchain (hundreds of autofixable style errors),
# so eslint runs on src/teletwin/ plus the files the PR changes, not on the whole repo.

name: TeleTwin web CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - teletwin

concurrency:
  group: teletwin-web-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: tsc + eslint + vitest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint (corp code + changed files)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          files="src/teletwin"
          if [ -n "$BASE_REF" ]; then
            changed=$(git diff --name-only --diff-filter=ACMR "origin/$BASE_REF...HEAD" -- '*.ts' '*.tsx' '*.js' | grep -v '^src/lib/gramjs/build/' || true)
            files="$files $changed"
          fi
          echo "Linting: $files"
          # shellcheck disable=SC2086
          npx eslint --no-warn-ignored --max-warnings 0 $files

      - name: Vitest
        run: npm test
