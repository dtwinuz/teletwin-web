# TeleTwin desktop packages: a Tauri shell that opens the hosted web app (BASE_URL),
# so web deploys update every desktop install. The shell itself updates through the Tauri updater:
# it reads latest.json of the latest GitHub Release (teletwin-release.yml) and checks the signature
# against the public key in tauri/tauri.teletwin.updater.conf.json. Not code-signed (no OS certificate yet).

name: TeleTwin desktop

on:
  workflow_dispatch:
  push:
    branches:
      - teletwin
    paths:
      - 'tauri/**'
      - '.github/workflows/teletwin-desktop.yml'
  workflow_call:
    inputs:
      version:
        description: 'Release tag (vX.Y.Z); empty = version from tauri/Cargo.toml'
        type: string
        default: ''
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true

permissions:
  contents: read

env:
  BASE_URL: https://dtwin.uz/teletwin/web/
  APP_TITLE: TeleTwin
  WITH_UPDATER: 'true'

jobs:
  package:
    name: Package ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            platform: windows-latest
            args: '--bundles nsis'
          - name: macos-arm64
            platform: macos-latest
            args: '--target aarch64-apple-darwin --bundles app,dmg'
          - name: macos-x64
            platform: macos-latest
            args: '--target x86_64-apple-darwin --bundles app,dmg'
          - name: linux
            platform: ubuntu-22.04
            args: '--bundles deb,appimage'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - name: Set version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            version="${RELEASE_TAG#v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Release tag must look like v1.2.3, got $RELEASE_TAG"
              exit 1
            fi
            printf '{ "version": "%s" }\n' "$version" > tauri/tauri.version.json
          else
            echo '{}' > tauri/tauri.version.json
          fi
          cat tauri/tauri.version.json

      - name: Build packages
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        id: build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          args: >-
            ${{ matrix.args }}
            -c tauri/tauri.teletwin.conf.json
            -c tauri/tauri.teletwin.updater.conf.json
            -c tauri/tauri.version.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TeleTwin-${{ matrix.name }}
          if-no-files-found: error
          path: |
            tauri/target/**/release/bundle/nsis/*.exe
            tauri/target/**/release/bundle/nsis/*.exe.sig
            tauri/target/**/release/bundle/dmg/*.dmg
            tauri/target/**/release/bundle/macos/*.app.tar.gz
            tauri/target/**/release/bundle/macos/*.app.tar.gz.sig
            tauri/target/**/release/bundle/deb/*.deb
            tauri/target/**/release/bundle/appimage/*.AppImage
            tauri/target/**/release/bundle/appimage/*.AppImage.sig
